<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#171020">
  <title>$GODOT_PROJECT_NAME</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#171020;touch-action:none;overscroll-behavior:none}
    canvas{display:block;position:fixed;inset:0;outline:none;touch-action:none}
    #loading{position:fixed;inset:0;display:grid;place-content:center;gap:18px;padding:24px;background:#171020;color:#ffe5a4;font:18px Georgia,serif;text-align:center;z-index:10}
    progress{width:260px;max-width:80vw;accent-color:#efc475}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Cavaleiros do Grimorio"></canvas>
<div id="loading"><div>Cavaleiros do Grimorio</div><progress id="progress"></progress><div id="notice">Preparando seu reino...</div></div>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  let desiredLandscape = false;
  let backHandler = null;
  let insetsHandler = null;
  let orientationRevision = 0;
  const supported = method => tg && typeof tg[method] === 'function' && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0');
  const requestFullscreen = () => {
    try { if (supported('requestFullscreen') && !tg.isFullscreen) tg.requestFullscreen(); } catch (_) {}
  };
  const orient = async () => {
    const revision = ++orientationRevision;
    try { if (supported('unlockOrientation')) tg.unlockOrientation(); } catch (_) {}
    // Browsers may reject locking inside a WebView; the Godot UI also supports
    // a rotated landscape layout with native Godot touch-coordinate transforms.
    const orientation = window.screen && window.screen.orientation;
    if (orientation && typeof orientation.lock === 'function') {
      try { await orientation.lock(desiredLandscape ? 'landscape' : 'portrait'); } catch (_) {}
    }
    if (revision !== orientationRevision) return;
    const isLandscape = window.innerWidth > window.innerHeight;
    try { if (isLandscape === desiredLandscape && supported('lockOrientation')) tg.lockOrientation(); } catch (_) {}
  };
  window.CloverPlatform = {
    get landscape() { return desiredLandscape; },
    setBackHandler(callback) { backHandler = callback; },
    setInsetsHandler(callback) { insetsHandler = callback; },
    getInsets() {
      const safe = tg && tg.safeAreaInset || {};
      const content = tg && tg.contentSafeAreaInset || {};
      return ['left','top','right','bottom'].map((side,index) => Math.max(safe[side]||0,content[side]||0) / Math.max(1,index%2 ? innerHeight : innerWidth));
    },
    setLandscape(horizontal) {
      desiredLandscape = Boolean(horizontal);
      if (tg && tg.BackButton) desiredLandscape ? tg.BackButton.show() : tg.BackButton.hide();
      requestFullscreen();
      orient();
    }
  };
  if (tg) {
    try { tg.ready(); tg.expand(); tg.setHeaderColor('#171020'); tg.setBackgroundColor('#171020'); } catch (_) {}
    try { if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes(); } catch (_) {}
    if (tg.BackButton) tg.BackButton.onClick(() => { if (backHandler) backHandler(); });
    for (const event of ['viewportChanged','safeAreaChanged','contentSafeAreaChanged','fullscreenChanged']) {
      tg.onEvent(event, () => { window.dispatchEvent(new Event('resize')); if(insetsHandler) insetsHandler(); });
    }
  }
  // Fullscreen can require a direct user gesture in a browser or Telegram client.
  document.addEventListener('pointerdown', () => { requestFullscreen(); orient(); }, { passive:true });
  window.addEventListener('orientationchange', () => setTimeout(orient, 100));
})();
</script>
<script src="$GODOT_URL"></script>
<script>
const engine = new Engine($GODOT_CONFIG);
const loading = document.getElementById('loading');
const notice = document.getElementById('notice');
const progress = document.getElementById('progress');
const missing = Engine.getMissingFeatures({threads:false});
if (missing.length) {
  notice.textContent = 'Este navegador precisa de WebGL 2 e WebAssembly para jogar: ' + missing.join(', ');
} else {
  engine.startGame({onProgress(current,total){
    if(total){progress.max=total;progress.value=current;}
  }}).then(() => {
    loading.remove();document.getElementById('canvas').focus();
  }).catch(error => {
    console.error(error);
    notice.textContent='Nao foi possivel abrir o jogo. Reabra o Mini App ou tente outro navegador.';
  });
}
</script>
</body>
</html>
